name: Update Events v2

concurrency:
  group: update-events
  cancel-in-progress: true
  
on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

jobs:
  update-events:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Events
        env:
          TOKEN: ${{ secrets.TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
        run: node scripts/fetchEvents.js

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add events.json

          if ! git diff --cached --quiet; then
            git commit -m "Update events"
            git push
          fi
